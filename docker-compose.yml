services:
  api:
    build: .
    ports: ["4030:4030"]
    env_file: .env
    depends_on: [mongo, postgres]
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: kobomarket}
    ports: ["5432:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
volumes: {mongo_data: {}, pg_data: {}}
